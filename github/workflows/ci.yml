name: AI Agency Studio CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-24.04

    services:
      # Temporary file storage volume emulation for zip compiler testing
      local-storage:
        image: alpine
        volumes:
          - /tmp/studio_outputs:/tmp/studio_outputs

    steps:
    - name: Checkout Source Code Tree
      uses: actions/checkout@v4

    - name: Configure Python Environment Stack
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Update Global Package Tools
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest httpx

    - name: Execute Automated Core Test Suites
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
        pytest backend/tests/ -v

    - name: Validate Frontend Compilation Matrix
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Verify Frontend Package Audits
      run: |
        cd frontend
        npm install
