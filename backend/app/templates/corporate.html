<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ brand_name }} Enterprise</title>
    <style>
        :root { --primary: {{ primary_color }}; }
        body { margin: 0; font-family: Inter, sans-serif; color: #1e293b; background-color: #f8fafc; }
        .navbar { background: #ffffff; padding: 1.25rem 5%; display: flex; justify-content: space-between; border-bottom: 1px solid #e2e8f0; }
        .brand { font-weight: 700; font-size: 1.25rem; color: var(--primary); }
        .container { max-width: 1200px; margin: 0 auto; padding: 6rem 2rem; display: flex; align-items: center; }
        .content { flex: 1; padding-right: 3rem; }
        h1 { font-size: 3rem; color: #0f172a; line-height: 1.2; margin-bottom: 1.5rem; }
        p { font-size: 1.125rem; color: #64748b; margin-bottom: 2rem; }
        .btn { background: var(--primary); color: #ffffff; padding: 0.75rem 1.75rem; border-radius: 8px; text-decoration: none; font-weight: 600; display: inline-block; }
        .preview-box { flex: 1; background: #ffffff; height: 350px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="brand">{{ brand_name }}</div>
        <div>Corporate Solutions</div>
    </div>
    <div class="container">
        <div class="content">
            <h1>Engineered for Scalable Performance.</h1>
            <p>{{ tagline }}</p>
            <a href="#" class="btn">Request Consultation</a>
        </div>
        <div class="preview-box"></div>
    </div>
</body>
</html>
