<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ brand_name }} | {{ tagline }}</title>
    <style>
        :root {
            --primary-color: {{ primary_color }};
            --text-dark: #111827;
            --text-light: #f9fafb;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--text-light);
            color: var(--text-dark);
            line-height: 1.6;
        }
        header {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        .hero {
            padding: 8rem 5%;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, #f3f4f6 100%);
        }
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            letter-spacing: -0.05em;
        }
        .hero p {
            font-size: 1.25rem;
            color: #4b5563;
            max-width: 600px;
            margin: 0 auto 2.5rem;
        }
        .cta-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }
        .cta-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">{{ brand_name }}</div>
    </header>

    <section class="hero">
        <h1>{{ brand_name }}</h1>
        <p>{{ tagline }}</p>
        <a href="#contact" class="cta-btn">Connect With Us</a>
    </section>

</body>
</html>
